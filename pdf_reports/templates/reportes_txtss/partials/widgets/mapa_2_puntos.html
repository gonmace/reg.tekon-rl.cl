{% if display.img_src %}
<table class="mapa-table">
  <tr>
    <td class="mapa-img-cell">
      <img src="{{ display.img_src }}" alt="Mapa">
    </td>
    <td class="mapa-leyenda-cell">
      {% for l in display.leyenda %}
        {% include "reportes_txtss/partials/leyenda.html" with icon_color=l.icon_color name=l.name %}
      {% endfor %}
      {% if display.distancia_str %}
      <p class="mapa-leyenda-nota">Distancia: {{ display.distancia_str }}</p>
      {% endif %}
    </td>
  </tr>
</table>
{% endif %}
